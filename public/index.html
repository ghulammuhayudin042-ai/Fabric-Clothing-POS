<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fabric POS</title>
<style>
:root{--b:#1d5fd1;--bg:#f4f7fc;--t:#14213d;--m:#64748b;--l:#dbe4f3}*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;color:var(--t);background:var(--bg);display:flex;height:100vh}
nav{width:190px;background:#fff;border-right:1px solid var(--l);padding:14px;display:flex;flex-direction:column;gap:4px}nav h1{font-size:16px;color:var(--b);margin:0 0 12px}
nav button{text-align:left;border:0;background:none;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--t)}nav button.on{background:#e8f0fe;color:var(--b);font-weight:600}
main{flex:1;overflow:auto;padding:18px}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.k{font-size:12px;color:var(--m)}.v{font-size:20px;font-weight:700}
input,select,button.p{padding:8px 10px;border:1px solid var(--l);border-radius:8px;font:inherit}button.p{background:var(--b);color:#fff;border:0;cursor:pointer}button.s{background:#fff;color:var(--b);border:1px solid var(--b);padding:6px 10px;border-radius:8px;cursor:pointer}
table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid var(--l);text-align:left}th{color:var(--m);font-weight:600;font-size:12px}.r{text-align:right}
#pos{display:grid;grid-template-columns:1fr 420px;gap:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}#msg{position:fixed;right:16px;bottom:16px;padding:10px 14px;border-radius:8px;color:#fff;display:none}
</style></head><body>
<nav><h1>Fabric POS</h1><button data-t="dash">Dashboard</button><button data-t="posv" class="on">New Sale</button><button data-t="prod">Products</button><button data-t="rolls">Roll Inventory</button><button data-t="purch">Purchases</button><button data-t="cust">Customers</button><button data-t="ret">Returns</button><button data-t="rep">Reports</button><button data-t="inv">Stock &amp; Movements</button><button data-t="shift">Shift</button><button data-t="exp">Expenses</button><button data-t="users">Users</button><button data-t="audit">Audit Log</button><button data-t="set">Settings</button><button data-t="logout" style="margin-top:auto;color:#b91c1c">Log out</button></nav>
<main id="main"></main><div id="msg"></div>
<script>
const $=s=>document.querySelector(s),api=async(u,b)=>{const r=await fetch('/api/'+u,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','x-token':window.TOK||''},body:b?JSON.stringify(b):undefined});const j=await r.json();if(r.status===401&&window.showLogin)showLogin();if(!r.ok)throw new Error(j.error);return j};
const M=p=>'PKR '+(p/100).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2}),Q=m=>String(+(m/1000).toFixed(3));
const toast=(t,ok=true)=>{const e=$('#msg');e.textContent=t;e.style.background=ok?'#15803d':'#b91c1c';e.style.display='block';setTimeout(()=>e.style.display='none',3500)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const table=(h,rows)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length} style="color:#64748b">No data yet</td></tr>`}</table>`;
let cart=[],cust=[],token=crypto.randomUUID(),last=null;
const tabs={
async dash(){const tdy=new Date().toLocaleDateString('en-CA'),f=$('#f')?$('#f').value:tdy,t=$('#t')?$('#t').value:tdy;const d=await api(`dashboard?from=${f}&to=${t}`);$('#main').innerHTML=`<div class=row>From <input type=date id=f value="${f}"> To <input type=date id=t value="${t}"><button class=p onclick="tabs.dash()">Apply</button></div>
<div class=grid>${[['Sales (gross)',d.sales],['Returns',d.returns],['Net sales',d.netSales],['Gross profit est.',d.grossProfit],['Purchases',d.purchases],['Expenses',d.expenses]].map(([a,b])=>`<div class=card><div class=k>${a}</div><div class=v>${M(b)}</div></div>`).join('')}<div class=card><div class=k>Invoices</div><div class=v>${d.invoices}</div></div></div>
<div class=grid><div class=card><b>Low stock</b>${table(['Item','Stock'],d.lowStock.map(x=>[esc(x.name),Q(x.stock)+' '+x.unit]))}</div><div class=card><b>Top items</b>${table(['Item','Qty','Amount'],d.topItems.map(x=>[esc(x.name),Q(x.qty)+' '+x.unit,M(x.amount)]))}</div><div class=card><b>Payment split</b>${table(['Method','Amount'],d.paymentSplit.map(x=>[x.method,M(x.amount)]))}</div></div><small class=k>Gross profit = net sale value − weighted-average cost of goods sold (operating expenses not deducted).</small>`},
async posv(){cust=await api('customers');window.ROLLS=await api('rolls');window.CATS=await api('categories');$('#main').innerHTML=`<div id=pos><div class=card><div class=row><input id=scan placeholder="Scan barcode / SKU (Enter)" style="flex:1" autofocus><input id=q placeholder="Search by name"><select id=cat><option value="">All categories</option>${CATS.map(c=>`<option value=${c.id}>${esc(c.name)}</option>`).join('')}</select></div><div id=res></div></div>
<div class=card><b>Cart</b><div id=cart></div><div class=row><select id=cu><option value="">Walk-in</option>${cust.map(c=>`<option value=${c.id}>${esc(c.name)}</option>`).join('')}</select><input id=bd placeholder="Bill discount" size=9></div>
<div class=row><select id=m1><option>cash</option><option>card</option><option>bank</option><option>easypaisa</option><option>jazzcash</option></select><input id=a1 placeholder="Amount" size=9><select id=m2><option value="">2nd method</option><option>cash</option><option>card</option><option>bank</option></select><input id=a2 placeholder="Amount" size=9></div>
<div id=tot class=v></div><div class=row><button class=p id=pay>Complete sale (F9)</button><button class=s onclick="cart=[];draw()">Clear</button><button class=s onclick="holdSale()">Hold</button><button class=s onclick="resumeSale()">Resume</button></div><div id=done></div></div></div>`;
const add=p=>{const e=cart.find(x=>x.p.id===p.id);if(!e)cart.push({p,qty:'1',discount:'0',rollId:null});draw()};
$('#scan').onkeydown=async e=>{if(e.key==='Enter'){const r=await api('products?barcode='+encodeURIComponent(e.target.value));e.target.value='';r[0]?add(r[0]):toast('Barcode not found',false)}};
$('#q').oninput=async e=>{const r=await api('products?q='+encodeURIComponent(e.target.value)+'&cat='+($('#cat').value||''));$('#res').innerHTML=table(['Name','Price','Stock',''],r.slice(0,12).map(p=>[esc(p.name),M(p.sale_price)+'/'+p.unit,Q(p.stock)+' '+p.unit,`<button class=s data-id=${p.id}>Add</button>`]));$('#res').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>add(r[i]))};
$('#cat').onchange=()=>$('#q').oninput({target:$('#q')});$('#q').oninput({target:$('#q')});
window.draw=()=>{const tot=cart.reduce((s,x)=>s+Math.round(Math.round(+x.qty*1000)*x.p.sale_price/1000)-Math.round((+x.discount||0)*100),0);
$('#cart').innerHTML=table(['Item','Qty','Disc','Total',''],cart.map((x,i)=>[esc(x.p.name)+`<br><small class=k>${M(x.p.sale_price)}/${x.p.unit} · stock ${Q(x.p.stock)}</small>`+rollSel(x,i),`<input size=5 value="${x.qty}" onchange="cart[${i}].qty=this.value;draw()"> ${x.p.unit}`,`<input size=4 value="${x.discount}" onchange="cart[${i}].discount=this.value;draw()">`,M(Math.round(Math.round(+x.qty*1000)*x.p.sale_price/1000)-Math.round((+x.discount||0)*100)),`<button class=s onclick="if(confirm('Remove item?')){cart.splice(${i},1);draw()}">×</button>`]));$('#tot').textContent='Total '+M(tot);if(!$('#a1').value)$('#a1').placeholder=(tot/100).toFixed(2)};draw();
$('#pay').onclick=window.pay=async()=>{const t=$('#pay');if(t.disabled)return;t.disabled=true;const body=()=>{const pays=[[$('#m1').value,$('#a1').value||$('#a1').placeholder],[$('#m2').value,$('#a2').value]].filter(x=>x[0]&&+x[1]>0).map(([method,amount])=>({method,amount}));return{customerId:+$('#cu').value||null,billDiscount:$('#bd').value||'0',payments:pays,clientToken:token,items:cart.map(x=>({productId:x.p.id,qty:x.qty,discount:x.discount||'0',rollId:x.rollId?+x.rollId:undefined}))}};
try{let r;try{r=await api('sales',body())}catch(e){if(/Insufficient/.test(e.message)&&confirm(e.message+'\n\nAuthorize negative-stock override? (manager/admin login needed)')){const username=prompt('Manager/admin username'),password=prompt('Password');r=await api('sales',{...body(),override:{username,password}})}else throw e}
token=crypto.randomUUID();cart=[];draw();toast('Sale saved '+r.invoiceNo+(r.change?` — change ${M(r.change)}`:'')+(r.balanceDue?` — due ${M(r.balanceDue)}`:''));$('#done').innerHTML=['58','80','A4'].map(z=>`<button class=s onclick="printInv(${r.saleId},'${z}')">Print ${z}</button>`).join(' ');printInv(r.saleId,window.RSIZE||'80')}catch(e){toast(e.message,false)}t.disabled=false}},
async prod(){const r=await api('products?q=');const cats=await api('categories');$('#main').innerHTML=`<div class=card><b>New product / variant</b><div class=row>${['sku','name','barcode','brand','fabric','color','design','size','cost_price','sale_price','wholesale_price','reorder_level'].map(k=>`<input id=n_${k} placeholder="${k}" size=11>`).join('')}<select id=n_unit><option>m</option><option>yd</option><option>pc</option><option>suit</option><option>roll</option><option>kg</option></select><select id=n_cat>${cats.map(c=>`<option value=${c.id}>${c.name}</option>`).join('')}</select><button class=p id=sv>Save</button></div></div>
<div class=card>${table(['SKU','Name','Unit','Cost','Price','Stock','Label'],r.map(p=>[p.sku,esc(p.name),p.unit,M(p.cost_price),M(p.sale_price),Q(p.stock),`<button class=s onclick='label(${JSON.stringify({n:p.name,b:p.barcode||p.sku,u:p.unit,p:p.sale_price}).replace(/'/g,"&#39;")})'>Label</button>`]))}</div>`;
$('#sv').onclick=async()=>{try{const b={};['sku','name','barcode','brand','fabric','color','design','size','cost_price','sale_price','wholesale_price','reorder_level'].forEach(k=>b[k]=$('#n_'+k).value);b.unit=$('#n_unit').value;b.category_id=$('#n_cat').value;await api('products',b);toast('Saved');tabs.prod()}catch(e){toast(e.message.includes('UNIQUE')?'Duplicate SKU/barcode':e.message,false)}}},
async rolls(){const r=await api('rolls');$('#main').innerHTML=`<div class=card>${table(['Roll ID','Fabric','Initial','Remaining','Cost/unit','Label'],r.map(x=>[x.roll_code,esc(x.name),Q(x.initial_length),Q(x.remaining_length),M(x.cost_per_unit),`<button class=s onclick="label({n:'${esc(x.name)}',b:'${x.roll_code}',u:'roll',p:0})">Label</button>`]))}</div><p class=k>Rolls are created when receiving a purchase with a Roll ID.</p>`},
async purch(){const [p,s]=await Promise.all([api('products?q='),api('suppliers')]);$('#main').innerHTML=`<div class=card><b>Receive purchase</b><div class=row><select id=ps>${s.map(x=>`<option value=${x.id}>${esc(x.name)}</option>`).join('')}</select><select id=pp>${p.filter(x=>!x.is_suit).map(x=>`<option value=${x.id}>${esc(x.name)} (${x.unit})</option>`).join('')}</select><input id=pq placeholder="Qty / length" size=9><input id=pc placeholder="Unit cost" size=9><input id=pr placeholder="Roll ID (optional)" size=14><button class=p id=pg>Receive</button></div></div><div class=card><b>New supplier</b><div class=row><input id=sn placeholder=Name><input id=sph placeholder=Phone><button class=s id=sa>Add</button></div></div>`;
$('#pg').onclick=async()=>{try{const r=await api('purchases',{supplierId:+$('#ps').value||null,userId:1,items:[{productId:+$('#pp').value,qty:$('#pq').value,unitCost:$('#pc').value,rollCode:$('#pr').value||undefined}]});toast('Received, total '+M(r.total))}catch(e){toast(e.message,false)}};$('#sa').onclick=async()=>{await api('suppliers',{name:$('#sn').value,phone:$('#sph').value});tabs.purch()}},
async cust(){const c=await api('customers');$('#main').innerHTML=`<div class=card><b>New customer</b><div class=row><input id=cn placeholder=Name><input id=cp placeholder=Phone><input id=ca placeholder=Address><input id=co placeholder="Opening balance" size=10><input id=cl placeholder="Credit limit" size=10><button class=p id=cs>Save</button></div></div><div class=card>${table(['Name','Phone','Balance','Receive payment'],c.map(x=>[esc(x.name),x.phone||'',M(x.balance),`<input id=lp${x.id} size=8 placeholder=amount><button class=s onclick="lpay(${x.id})">Pay</button>`]))}</div>`;
$('#cs').onclick=async()=>{try{await api('customers',{name:$('#cn').value,phone:$('#cp').value,address:$('#ca').value,opening_balance:$('#co').value||0,credit_limit:$('#cl').value||0});tabs.cust()}catch(e){toast(e.message,false)}};
window.lpay=async id=>{try{const r=await api('ledger-payment',{customerId:id,amount:$('#lp'+id).value});toast('Balance now '+M(r.balance));tabs.cust()}catch(e){toast(e.message,false)}}},
async ret(){const s=await api('sales');$('#main').innerHTML=`<div class=card><b>Invoices</b> (select to return items / reprint)${table(['Invoice','Date','Customer','Total',''],s.map(x=>[x.invoice_no,x.ts,esc(x.customer||'Walk-in'),M(x.total),`<button class=s onclick="openRet(${x.id})">Open</button>`]))}</div><div id=rd></div>`;
window.openRet=async id=>{window.curSale=id;const inv=await api('invoice?id='+id);$('#rd').innerHTML=`<div class=card><b>${inv.invoice_no}</b> ${['58','80','A4'].map(z=>`<button class=s onclick="printInv(${id},'${z}')">Reprint ${z}</button>`).join(' ')}${table(['Item','Sold','Returned','Return qty'],inv.items.map(i=>[esc(i.name),Q(i.qty)+' '+i.unit,Q(i.returned_qty),`<input size=5 class=rq data-id=${i.id} placeholder=0>`]))}<div class=row><input id=rr placeholder=Reason><label><input type=checkbox id=rs checked> Restock</label><button class=p id=rb>Process return</button></div><div class=row><b>Exchange:</b><input id=xs placeholder="New item barcode/SKU"><input id=xq placeholder=qty size=5 value=1><input id=xp placeholder="Extra cash paid" size=10><button class=p id=xb>Exchange</button></div></div>`;
$('#rb').onclick=async()=>{try{const items=[...document.querySelectorAll('.rq')].filter(e=>+e.value>0).map(e=>({saleItemId:+e.dataset.id,qty:e.value}));const r=await api('returns',{saleId:id,userId:1,items,reason:$('#rr').value,restock:$('#rs').checked});toast('Refund '+M(r.refund));tabs.ret()}catch(e){toast(e.message,false)}}}},
async rep(){const f=$('#rf')?.value||'',t=$('#rt')?.value||'',k=$('#rk')?.value||'product';const d=await api(`report?type=${k}&from=${f}&to=${t}`);$('#main').innerHTML=`<div class=row><select id=rk>${['product','category','employee','payment','rolls','balances','returns','expenses','purchases','suppliers'].map(x=>`<option ${x==k?'selected':''}>${x}</option>`).join('')}</select><input type=date id=rf value="${f}"><input type=date id=rt value="${t}"><button class=p onclick="tabs.rep()">Run</button><button class=s onclick="window.print()">Print A4</button></div><div class=card>${table(['Label','Qty/Detail','Amount'],d.map(x=>[esc(x.label),x.qty!=null?Q(x.qty):esc(x.name||''),k=='rolls'?Q(x.amount):M(x.amount)]))}</div>`},
async set(){const s=Object.fromEntries((await api('settings')).map(r=>[r.key,r.value]));const keys=['store_name','store_phone','store_address','currency','invoice_prefix','tax_enabled','tax_rate_bp','footer'];$('#main').innerHTML=`<div class=card><b>Settings</b><p class=k>tax_rate_bp: 1700 = 17%. tax_enabled: 1/0.</p>${keys.map(k=>`<div class=row><label style="width:140px">${k}</label><input id=s_${k} value="${esc(s[k]||'')}"></div>`).join('')}<button class=p id=ss>Save</button> <button class=s id=bk>Backup now</button></div>`;
$('#ss').onclick=async()=>{const b={};keys.forEach(k=>b[k]=$('#s_'+k).value);await api('settings',b);toast('Saved')};$('#bk').onclick=async()=>toast('Backup: '+(await api('backup',{})).path)}};
Object.assign(tabs,{
async logout(){try{await api('logout',{})}catch(e){}try{sessionStorage.removeItem('tok')}catch(e){}window.TOK='';showLogin()},
async shift(){const s=await api('shift');$('#main').innerHTML=`<div class=card><b>Cashier shift</b><p>${s?`Open since ${s.opened_at}, opening cash ${M(s.opening_cash)}`:'No open shift'}</p><div class=row><input id=sc placeholder="${s?'Counted cash in drawer':'Opening cash'}"><button class=p id=sb>${s?'Close shift':'Open shift'}</button></div><div id=sr></div></div>`;$('#sb').onclick=async()=>{try{if(s){if(!confirm('Close shift?'))return;const r=await api('shift-close',{cash:$('#sc').value});$('#sr').innerHTML=`Expected ${M(r.expected)} · counted ${M(r.counted)} · difference <b>${M(r.difference)}</b>`}else{await api('shift-open',{cash:$('#sc').value});tabs.shift()}}catch(e){toast(e.message,false)}}},
async exp(){const e=await api('expenses');$('#main').innerHTML=`<div class=card><b>Add expense</b><div class=row><input id=et placeholder="Title (rent, electricity...)"><input id=ea placeholder=Amount size=10><button class=p id=eb>Save</button></div></div><div class=card>${table(['Date','Title','Amount'],e.map(x=>[x.ts,esc(x.title),M(x.amount)]))}</div>`;$('#eb').onclick=async()=>{try{await api('expenses',{title:$('#et').value,amount:$('#ea').value});tabs.exp()}catch(x){toast(x.message,false)}}},
async inv(){const [p,r]=await Promise.all([api('products?q='),api('rolls')]);const pid=+($('#mf')?.value||0);const mv=await api('movements?productId='+pid);window.ROLLS=r;
$('#main').innerHTML=`<div class=card><b>Stock adjustment / damage</b> <small class=k>Use a minus sign to reduce, e.g. -0.5</small><div class=row><select id=ap>${p.filter(x=>!x.is_suit).map(x=>`<option value=${x.id}>${esc(x.name)} (${Q(x.stock)} ${x.unit})</option>`).join('')}</select><input id=aq placeholder="+5 or -0.5" size=9><select id=at><option>adjustment</option><option>damage</option></select><input id=an placeholder=Note><button class=p id=ab>Apply</button></div></div>
<div class=card><b>Stock movement history</b> <select id=mf onchange="tabs.inv()"><option value=0>All items</option>${p.map(x=>`<option value=${x.id} ${x.id==pid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${table(['Time','Item','Qty','Type','Source'],mv.map(x=>[x.ts,esc(x.name),(x.qty>0?'+':'')+Q(x.qty),x.type,(x.source_type||'')+' #'+(x.source_id||'')]))}</div>`;
$('#ab').onclick=async()=>{try{await api('adjust',{productId:+$('#ap').value,qty:$('#aq').value,type:$('#at').value,note:$('#an').value});toast('Stock updated');tabs.inv()}catch(e){toast(e.message,false)}}},
async users(){const u=await api('users');$('#main').innerHTML=`<div class=card><b>New user</b><div class=row><input id=un placeholder=Username><input id=up type=password placeholder="Password (6+)"><select id=ur><option>cashier</option><option>manager</option><option>admin</option></select><button class=p id=ub>Create</button></div></div><div class=card>${table(['User','Role','Active',''],u.map(x=>[x.username,x.role,x.active?'Yes':'No',`<button class=s onclick="api('users',{toggle:${x.id}}).then(tabs.users)">Enable/Disable</button>`]))}</div>`;$('#ub').onclick=async()=>{try{await api('users',{username:$('#un').value,password:$('#up').value,role:$('#ur').value});tabs.users()}catch(e){toast(e.message,false)}}},
async audit(){const a=await api('audit');$('#main').innerHTML=`<div class=card><b>Activity / audit log</b>${table(['Time','User','Action','Record','Detail'],a.map(x=>[x.ts,esc(x.username||'-'),x.action,(x.record_type||'')+' #'+(x.record_id||''),`<small>${esc(x.detail||'')}</small>`]))}</div>`},
async prod(){const q=$('#pq2')?$('#pq2').value:'',pg=window.PG||0;const [r,cats,sup]=await Promise.all([api('products?all=1&q='+encodeURIComponent(q)),api('categories'),api('suppliers')]);const rows=r.slice(pg*20,pg*20+20);
const f=['sku','name','barcode','brand','fabric','color','design','size','cost_price','sale_price','wholesale_price','reorder_level'];
$('#main').innerHTML=`<div class=card><b>New product / variant</b> <small class=k>Leave barcode empty to auto-generate a unique one. Prices are per selected unit.</small><div class=row>${f.map(k=>`<input id=n_${k} placeholder="${k}" size=11>`).join('')}<select id=n_unit><option>m</option><option>yd</option><option>pc</option><option>suit</option><option>roll</option><option>kg</option></select><select id=n_cat>${cats.map(c=>`<option value=${c.id}>${esc(c.name)}</option>`).join('')}</select><select id=n_sup><option value="">Supplier</option>${sup.map(c=>`<option value=${c.id}>${esc(c.name)}</option>`).join('')}</select><input id=n_comp placeholder="Suit components SKU:qty, SKU:qty" size=30><button class=p id=sv>Save</button></div>
<div class=row><b>Quick size variants:</b><input id=v_sizes placeholder="XS,S,M,L,XL,XXL" size=18><span class=k>uses the SKU/name/prices above; creates SKU-SIZE with own barcode &amp; stock</span><button class=s id=vb>Create variants</button><input id=nc placeholder="New category"><button class=s id=ncb>Add category</button></div></div>
<div class=card><div class=row><input id=pq2 placeholder="Search products" value="${esc(q)}" onchange="window.PG=0;tabs.prod()"><button class=s onclick="window.PG=Math.max(0,${pg}-1);tabs.prod()">Prev</button><span>Page ${pg+1} / ${Math.max(1,Math.ceil(r.length/20))}</span><button class=s onclick="window.PG=${pg+1<Math.ceil(r.length/20)?pg+1:pg};tabs.prod()">Next</button></div>
${table(['SKU','Name','Size','Unit','Cost','Price','Stock','Active','Actions'],rows.map(p=>[p.sku,esc(p.name),p.size||'',p.unit,M(p.cost_price),M(p.sale_price),Q(p.stock),p.active?'Yes':'<b>No</b>',`<button class=s onclick='label(${JSON.stringify({n:p.name,b:p.barcode||p.sku,u:p.unit,p:p.sale_price}).replace(/'/g,"&#39;")})'>Label</button> <button class=s onclick="editP(${p.id})">Price</button> <button class=s onclick="togP(${p.id},${p.active?0:1})">${p.active?'Deactivate':'Activate'}</button>`]))}</div>`;

async purch(){const [p,s,pu]=await Promise.all([api('products?q='),api('suppliers'),api('purchases')]);$('#main').innerHTML=`<div class=card><b>Receive purchase</b><div class=row><select id=ps>${s.map(x=>`<option value=${x.id}>${esc(x.name)}</option>`).join('')}</select><select id=pp>${p.filter(x=>!x.is_suit).map(x=>`<option value=${x.id}>${esc(x.name)} (${x.unit})</option>`).join('')}</select><input id=pq placeholder="Qty / length" size=9><input id=pc placeholder="Unit cost" size=9><input id=pr placeholder="Roll ID (optional)" size=14><input id=pd placeholder="Paid now" size=9><button class=p id=pg>Receive</button></div></div>
<div class=card><b>Suppliers</b><div class=row><input id=sn placeholder=Name><input id=sph placeholder=Phone><button class=s id=sa>Add supplier</button></div>${table(['Supplier','Phone','Balance payable','Pay'],s.map(x=>[esc(x.name),x.phone||'',M(x.balance),`<input id=sp${x.id} size=8 placeholder=amount><button class=s onclick="spay(${x.id})">Pay</button>`]))}</div>
<div class=card><b>Purchase invoices</b>${table(['#','Date','Supplier','Ref','Total','Paid',''],pu.map(x=>[x.id,x.ts,esc(x.supplier||'-'),esc(x.ref_no||''),M(x.total),M(x.paid),`<button class=s onclick="pret(${x.id})">Return items</button>`]))}<div id=pr2></div></div>`;
$('#pg').onclick=async()=>{try{const r=await api('purchases',{supplierId:+$('#ps').value||null,paid:$('#pd').value||'0',items:[{productId:+$('#pp').value,qty:$('#pq').value,unitCost:$('#pc').value,rollCode:$('#pr').value||undefined}]});toast('Received, total '+M(r.total));tabs.purch()}catch(e){toast(e.message,false)}};
$('#sa').onclick=async()=>{await api('suppliers',{name:$('#sn').value,phone:$('#sph').value});tabs.purch()};
window.spay=async id=>{try{const r=await api('supplier-payment',{supplierId:id,amount:$('#sp'+id).value});toast('Balance now '+M(r.balance));tabs.purch()}catch(e){toast(e.message,false)}};
window.pret=async id=>{const it=await api('purchase-items?id='+id);$('#pr2').innerHTML=table(['Item','Received','Returned','Return qty'],it.map(i=>[esc(i.name),Q(i.qty),Q(i.returned_qty),`<input class=pq size=5 data-id=${i.id} placeholder=0>`]))+'<button class=p id=prb>Return to supplier</button>';$('#prb').onclick=async()=>{try{const items=[...document.querySelectorAll('.pq')].filter(e=>+e.value>0).map(e=>({purchaseItemId:+e.dataset.id,qty:e.value}));const r=await api('purchase-return',{purchaseId:id,items});toast('Returned, credit '+M(r.amount));tabs.purch()}catch(e){toast(e.message,false)}}}},
async cust(){const c=await api('customers');$('#main').innerHTML=`<div class=card><b>New customer</b><div class=row><input id=cn placeholder=Name><input id=cp placeholder=Phone><input id=ca placeholder=Address><input id=co placeholder="Opening balance" size=10><input id=cl placeholder="Credit limit" size=10><button class=p id=cs>Save</button></div></div><div class=card>${table(['Name','Phone','Credit limit','Balance','Receive payment',''],c.map(x=>[esc(x.name),x.phone||'',M(x.credit_limit),M(x.balance),`<input id=lp${x.id} size=8 placeholder=amount><select id=lm${x.id}><option>cash</option><option>card</option><option>bank</option></select><button class=s onclick="lpay(${x.id})">Pay</button>`,`<button class=s onclick="hist(${x.id},'${esc(x.name)}')">Ledger</button>`]))}</div>`;
$('#cs').onclick=async()=>{try{await api('customers',{name:$('#cn').value,phone:$('#cp').value,address:$('#ca').value,opening_balance:$('#co').value||0,credit_limit:$('#cl').value||0});tabs.cust()}catch(e){toast(e.message,false)}};
window.lpay=async id=>{try{const r=await api('ledger-payment',{customerId:id,amount:$('#lp'+id).value,method:$('#lm'+id).value});toast('Balance now '+M(r.balance));tabs.cust()}catch(e){toast(e.message,false)}};
window.hist=async(id,n)=>{const l=await api('ledger?id='+id);pw(`<h3>Ledger: ${n}</h3>${table(['Date','Invoice','Total'],l.sales.map(x=>[x.ts,x.invoice_no,M(x.total)]))}<h4>Payments</h4>${table(['Date','Method','Amount','Type'],l.payments.map(x=>[x.ts,x.method,M(x.amount),x.kind]))}<h3>Outstanding: ${M(l.balance)}</h3>`,'body{font:13px sans-serif;padding:10px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ccc;padding:4px;text-align:left}')}},
async set(){const s=Object.fromEntries((await api('settings')).map(r=>[r.key,r.value]));const keys=['store_name','store_phone','store_address','currency','invoice_prefix','tax_enabled','tax_rate_bp','footer'];$('#main').innerHTML=`<div class=card><b>Settings</b><p class=k>tax_enabled: 1 or 0 · tax_rate_bp: 1700 = 17% · currency default PKR.</p>${keys.map(k=>`<div class=row><label style="width:140px">${k}</label><input id=s_${k} value="${esc(s[k]||'')}"></div>`).join('')}<div class=row><label style="width:140px">receipt_size</label><select id=s_receipt_size>${['58','80','A4'].map(z=>`<option ${s.receipt_size==z?'selected':''}>${z}</option>`).join('')}</select></div><div class=row><label style="width:140px">Store logo</label><input type=file id=lg accept="image/*"></div><button class=p id=ss>Save</button> <button class=s id=bk>Backup now</button></div>

let logo=s.store_logo||'';$('#lg').onchange=e=>{const fr=new FileReader();fr.onload=()=>logo=fr.result;fr.readAsDataURL(e.target.files[0])};
$('#ss').onclick=async()=>{try{const b={};keys.forEach(k=>b[k]=$('#s_'+k).value);b.receipt_size=$('#s_receipt_size').value;if(logo)b.store_logo=logo;await api('settings',b);window.RSIZE=b.receipt_size;toast('Saved')}catch(e){toast(e.message,false)}};$('#bk').onclick=async()=>toast('Backup: '+(await api('backup',{})).path)}});

window.testPrint=z=>pw(`<div style="text-align:center"><b>TEST PRINT ${z}</b><br>Fabric POS<br>${bars('TEST-123')}</div>`,z==='A4'?'@page{size:A4;margin:15mm}body{font:14px sans-serif}':`@page{size:${z}mm auto;margin:0}body{width:${z}mm;margin:0;padding:2mm;font:11px monospace}`);
window.rollSel=(x,i)=>{const r=(window.ROLLS||[]).filter(o=>o.product_id===x.p.id&&o.remaining_length>0);return r.length?`<br><select onchange="cart[${i}].rollId=this.value||null"><option value="">Shared stock</option>${r.map(o=>`<option value=${o.id} ${x.rollId==o.id?'selected':''}>${o.roll_code} (${Q(o.remaining_length)} left)</option>`).join('')}</select>`:''};
window.holdSale=async()=>{if(!cart.length)return toast('Cart is empty',false);const label=prompt('Label for held sale (e.g. customer name)','Held');if(label===null)return;await api('hold',{label,payload:{customer:$('#cu').value,items:cart.map(x=>({barcode:x.p.barcode||x.p.sku,qty:x.qty,discount:x.discount,rollId:x.rollId}))}});cart=[];draw();toast('Sale held')};
window.resumeSale=async()=>{const h=await api('held');if(!h.length)return toast('No held sales',false);const id=prompt('Enter number to resume:\n'+h.map(x=>`${x.id}: ${x.label} (${x.ts})`).join('\n'));const x=h.find(y=>y.id==id);if(!x)return;const pl=JSON.parse(x.payload);cart=[];for(const it of pl.items){const p=(await api('products?barcode='+encodeURIComponent(it.barcode)))[0];if(p)cart.push({p,qty:it.qty,discount:it.discount,rollId:it.rollId})}$('#cu').value=pl.customer||'';draw();await api('held-delete',{id:x.id})};
document.addEventListener('click',async e=>{if(e.target.id!=='xb')return;try{const returned=[...document.querySelectorAll('.rq')].filter(i=>+i.value>0).map(i=>({saleItemId:+i.dataset.id,qty:i.value}));if(!returned.length)throw new Error('Enter the return quantity first');const p=(await api('products?barcode='+encodeURIComponent($('#xs').value)))[0];if(!p)throw new Error('New item not found');const pay=+$('#xp').value>0?[{method:'cash',amount:$('#xp').value}]:[];const r=await api('exchange',{saleId:window.curSale,returned,newItems:[{productId:p.id,qty:$('#xq').value}],payments:pay});toast(`Exchange done: new invoice ${r.invoiceNo}`+(r.balanceDue?`, due ${M(r.balanceDue)}`:'')+(r.cashBack?`, cash back ${M(r.cashBack)}`:''));printInv(r.saleId,window.RSIZE||'80');tabs.ret()}catch(x){toast(x.message,false)}});
window.editP=async id=>{const v=prompt('New sale price (per unit)');if(v){try{await api('products/update',{id,sale_price:v});tabs.prod()}catch(e){toast(e.message,false)}}};
window.togP=async(id,a)=>{if(!confirm(a?'Activate product?':'Deactivate product? It will disappear from POS.'))return;await api('products/update',{id,active:a});tabs.prod()};
const PERMS={admin:['*'],manager:['sale','return','override','purchase','product','report','expense','adjust','customer','shift','audit'],cashier:['sale','customer','shift']},TABP={dash:'report',prod:'product',purch:'purchase',ret:'return',rep:'report',set:'admin',users:'admin',audit:'audit',exp:'expense',inv:'adjust'};
window.showLogin=()=>{if($('#lg2'))return;const d=document.createElement('div');d.id='lg2';d.style.cssText='position:fixed;inset:0;background:#f4f7fc;display:flex;align-items:center;justify-content:center;z-index:99';d.innerHTML='<div class=card style="width:320px"><h2 style="color:#1d5fd1;margin-top:0">Fabric POS</h2><div class=row><input id=lu placeholder=Username style="width:100%"></div><div class=row><input id=lp2 type=password placeholder=Password style="width:100%"></div><button class=p id=li style="width:100%">Log in</button></div>';document.body.appendChild(d);
const go=async()=>{try{const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp2').value})});const j=await r.json();if(!r.ok)throw new Error(j.error);window.TOK=j.token;window.USER=j.user;try{sessionStorage.tok=j.token}catch(e){}d.remove();start()}catch(e){toast(e.message,false)}};$('#li').onclick=go;$('#lp2').onkeydown=e=>{if(e.key==='Enter')go()};$('#lu').focus()};
async function start(){const u=window.USER||await api('me');window.USER=u;const ok=p=>PERMS[u.role].includes('*')||PERMS[u.role].includes(p);document.querySelectorAll('nav button').forEach(b=>{const p=TABP[b.dataset.t];b.style.display=p&&!ok(p)?'none':''});try{const s=Object.fromEntries((await api('settings')).map(r=>[r.key,r.value]));window.RSIZE=s.receipt_size}catch(e){}tabs.posv()}
window.boot=async()=>{try{window.TOK=sessionStorage.tok||''}catch(e){window.TOK=''}if(!window.TOK)return showLogin();try{await start()}catch(e){showLogin()}};
// ---------- printing ----------
const C39={0:'nnnwwnwnn',1:'wnnwnnnnw',2:'nnwwnnnnw',3:'wnwwnnnnn',4:'nnnwwnnnw',5:'wnnwwnnnn',6:'nnwwwnnnn',7:'nnnwnnwnw',8:'wnnwnnwnn',9:'nnwwnnwnn',A:'wnnnnwnnw',B:'nnwnnwnnw',C:'wnwnnwnnn',D:'nnnnwwnnw',E:'wnnnwwnnn',F:'nnwnwwnnn',G:'nnnnnwwnw',H:'wnnnnwwnn',I:'nnwnnwwnn',J:'nnnnwwwnn',K:'wnnnnnnww',L:'nnwnnnnww',M:'wnwnnnnwn',N:'nnnnwnnww',O:'wnnnwnnwn',P:'nnwnwnnwn',Q:'nnnnnnwww',R:'wnnnnnwwn',S:'nnwnnnwwn',T:'nnnnwnwwn',U:'wwnnnnnnw',V:'nwwnnnnnw',W:'wwwnnnnnn',X:'nwnnwnnnw',Y:'wwnnwnnnn',Z:'nwwnwnnnn','-':'nwnnnnwnw','*':'nwnnwnwnn'};
function bars(v,h=34){let x=0,o='';for(const ch of '*'+String(v).toUpperCase().replace(/[^0-9A-Z-]/g,'-')+'*'){[...C39[ch]].forEach((w,i)=>{const wd=w=='w'?3:1;if(i%2==0)o+=`<rect x=${x} y=0 width=${wd} height=${h} />`;x+=wd});x+=1}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x} ${h}" width="${Math.min(x,200)}" height="${h}" preserveAspectRatio="none">${o}</svg>`}
function pw(html,css){const w=open('','_blank','width=560,height=720');w.document.write(`<html><head><title>Print preview</title><style>${css}@media print{.np{display:none}}</style></head><body><div class=np style="padding:6px;background:#e8f0fe;font:13px sans-serif">Print preview &nbsp;<button onclick="print()">Print</button> <button onclick="close()">Close</button></div>${html}</body></html>`);w.document.close();w.focus()}
window.label=o=>{const size=prompt('Label size: 40x25, 50x30 or 58x40 (mm)','50x30')||'50x30';const[wm,hm]=size.split('x');pw(`<div class=l><b>${esc(o.n)}</b>${bars(o.b)}<span>${esc(o.b)} · per ${o.u}${o.p?' · '+M(o.p):''}</span></div>`,`@page{size:${wm}mm ${hm}mm;margin:0}body{margin:0}.l{width:${wm}mm;height:${hm}mm;padding:1.5mm;font:8px sans-serif;text-align:center;overflow:hidden}.l svg{width:90%;height:${hm*0.4}mm}`)};
window.printInv=async(id,size)=>{const v=await api('invoice?id='+id),s=v.store,paid=v.payments.reduce((a,p)=>a+p.amount,0),due=v.total-paid,store=(s.store_logo?`<img src="${s.store_logo}" style="max-height:50px">`:'')+`<h2>${esc(s.store_name||'Store')}</h2><div>${esc(s.store_phone||'')} ${esc(s.store_address||'')}</div>`;
const meta=`Invoice: ${v.invoice_no}<br>${v.ts}<br>Cashier: ${esc(v.cashier||'-')}${v.customer?'<br>Customer: '+esc(v.customer):''}`;
const tot=`<div class=t>Subtotal <b>${M(v.subtotal)}</b></div>${v.discount?`<div class=t>Discount <b>-${M(v.discount)}</b></div>`:''}${v.tax?`<div class=t>Tax <b>${M(v.tax)}</b></div>`:''}<div class="t g">TOTAL <b>${M(v.total)}</b></div><div class=t>Paid (${v.payments.map(p=>p.method).join('+')||'-'}) <b>${M(paid)}</b></div>${due>0?`<div class=t>Balance due <b>${M(due)}</b></div>`:''}`;
const foot=`<p style="text-align:center">${esc(s.footer||'Thank you!')}</p><div style="text-align:center">${bars(v.invoice_no,28)}</div>`;
if(size==='A4'){const rows=v.items.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(i.name)}</td><td>${Q(i.qty)} ${i.unit}</td><td>${M(i.unit_price)}</td><td>${M(i.discount)}</td><td>${M(i.line_total)}</td></tr>`).join('');
return pw(`<div class=h>${store}<div style="text-align:right">${meta}</div></div><table><tr><th>#</th><th>Item</th><th>Qty</th><th>Price</th><th>Disc</th><th>Total</th></tr>${rows}</table><div style="width:260px;margin-left:auto">${tot}</div><p>Payment status: <b>${due>0?'PARTIAL / CREDIT':'PAID'}</b></p><div style="margin-top:60px;display:flex;justify-content:space-between"><span>Customer signature ______</span><span>Authorized signature ______</span></div>${foot}`,`@page{size:A4;margin:15mm}body{font:13px sans-serif}.h{display:flex;justify-content:space-between;border-bottom:2px solid #1d5fd1;margin-bottom:12px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ccc;padding:6px;text-align:left}.t{display:flex;justify-content:space-between;padding:3px 0}.g{font-size:16px;border-top:2px solid #000}`)}
const w=size==='58'?'58mm':'80mm',n=size==='58';
const rows=v.items.map(i=>`<div><b>${esc(i.name)}</b></div><div class=t><span>${Q(i.qty)} ${i.unit} × ${M(i.unit_price).replace('PKR ','')}</span><b>${M(i.line_total).replace('PKR ','')}</b></div>`).join('');
pw(`<div style="text-align:center">${store}</div><div>${meta}</div><hr>${rows}<hr>${tot}<hr>${foot}`,`@page{size:${w} auto;margin:0}body{width:${w};margin:0;padding:2mm;font:${n?'10px':'12px'} monospace}h2{margin:2px;font-size:${n?'13px':'16px'}}.t{display:flex;justify-content:space-between;gap:4px}.g{font-size:${n?'12px':'15px'};font-weight:bold}hr{border:0;border-top:1px dashed #000}`)};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tabs[b.dataset.t]().catch(e=>toast(e.message,false))});
document.addEventListener('keydown',e=>{if(e.key==='F9'&&window.pay){e.preventDefault();window.pay()}});boot();
</script></body></html>
